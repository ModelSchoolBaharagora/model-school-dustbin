<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Autonomous Dustbin 3D City</title>
    <meta name="description" content="Made in India 3D Smart City simulation featuring an autonomous municipal dustbin with road white-line tracking, 200m patrol cycles, citizen crowd trash deposits, and auto-halt obstacle avoidance for cows (gay/bail)." />
    <meta property="og:title" content="Smart Autonomous Dustbin 3D City" />
    <meta property="og:description" content="Made in India 3D Smart City simulation featuring an autonomous municipal dustbin with road white-line tracking, 200m patrol cycles, citizen crowd trash deposits, and auto-halt obstacle avoidance for cows (gay/bail)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body style="margin: 0; background-color: #0f172a; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background: radial-gradient(circle at center, #1e293b, #090d16); color: #f8fafc; text-align: center; padding: 20px; box-sizing: border-box;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 24px;">
          <div style="position: absolute; inset: 0; border: 4px solid rgba(16, 185, 129, 0.2); border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          <div style="position: absolute; inset: 10px; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: spin 1.5s linear infinite reverse;"></div>
        </div>
        <h1 style="margin: 0 0 8px 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; color: #10b981;">
          🇮🇳 SMART AUTONOMOUS DUSTBIN 3D
        </h1>
        <p style="margin: 0 0 16px 0; font-size: 13px; color: #94a3b8; max-width: 320px;">
          Loading 3D Smart City, white-line sensors & obstacle tracking...
        </p>
        <span style="display: inline-block; font-size: 11px; padding: 4px 12px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 9999px; color: #34d399; font-weight: 600;">
          MADE IN INDIA • 100% INDIGENOUS
        </span>
      </div>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
